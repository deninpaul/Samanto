
name: Deploy Website Versions

on:
  push:
    branches:
      - main
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare deployment
        run: |
          mkdir -p deploy

          for branch in $(git branch -r --list 'origin/v*' | sed 's|origin/||'); do
            echo "Deploying $branch"

            mkdir -p "deploy/$branch"

            git archive "origin/$branch" | tar -x -C "deploy/$branch"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
